services:
  - type: web
    name: hae-auditoria-prototipo
    env: node
    plan: free
    buildCommand: npm ci --omit=dev && node tools/build-android-web.js && cd www && zip -qr ../idauditor-web.zip .
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FILE_STORAGE_DIR
        value: /var/data/uploads
      - key: STRUCTURED_APIS_ENABLED
        value: "true"
