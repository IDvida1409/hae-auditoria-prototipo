<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>IDAuditor | Acesso</title>
    <link rel="icon" href="assets/app-icon-reference.png">
    <link rel="stylesheet" href="login.css?v=20261001-password-reset-1">
  </head>
  <body>
    <main class="access-main">
      <section class="access-modal" aria-labelledby="access-title">
        <div class="access-art" aria-hidden="true"><img src="assets/login-reference.png" alt=""></div>
        <div class="access-content">
          <div class="product-logo-frame"><img class="product-logo" src="assets/idvida-login-logo.png" alt="IDvida"></div>
          <h1 id="access-title" class="sr-only">LOGIN</h1>
          <form id="login-form" autocomplete="off">
            <label class="field">
              <span class="sr-only">Usuário</span>
              <div class="input-wrap"><input name="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Usuário" required minlength="3" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{2,63}"><i data-lucide="user-round" aria-hidden="true"></i></div>
            </label>
            <label class="field">
              <span class="sr-only">Senha</span>
              <div class="input-wrap"><i data-lucide="lock-keyhole" aria-hidden="true"></i><input name="password" type="password" autocomplete="off" placeholder="Senha" required maxlength="128"><button class="icon-button" type="button" data-password-toggle title="Mostrar senha" aria-label="Mostrar senha"><i data-lucide="eye" aria-hidden="true"></i></button></div>
            </label>
            <div class="login-options"><button type="button" class="text-button" id="help-button">Esqueceu a senha?</button></div>
            <button class="primary-button" type="submit"><span>Login</span></button>
            <button type="button" class="text-button first-access-link" id="first-access-button">Primeiro acesso</button>
          </form>
          <form id="first-access-form" hidden autocomplete="off">
            <label class="field"><span>Código recebido</span><div class="input-wrap"><input name="code" type="text" autocomplete="one-time-code" required minlength="8" maxlength="16" placeholder="Digite o código"></div></label>
            <div class="first-access-user" id="first-access-user" hidden></div>
            <label class="field first-access-password" hidden><span>Nova senha</span><div class="input-wrap"><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Crie uma senha"></div></label>
            <label class="field first-access-password" hidden><span>Confirmar nova senha</span><div class="input-wrap"><input name="confirmation" type="password" autocomplete="new-password" maxlength="128" required placeholder="Repita a senha"></div></label>
            <button class="primary-button" type="submit"><span>Validar código</span></button>
            <button class="text-button first-access-back" id="first-access-back" type="button">Voltar para o login</button>
          </form>
          <form id="password-reset-form" hidden autocomplete="off">
            <label class="field"><span>Usuário</span><div class="input-wrap"><input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="64" placeholder="nome.sobrenome"></div></label>
            <label class="field"><span>Código temporário</span><div class="input-wrap"><input name="code" type="text" autocomplete="one-time-code" required minlength="8" maxlength="16" placeholder="Digite o código recebido"></div></label>
            <div class="first-access-user" id="password-reset-user" hidden></div>
            <label class="field password-reset-password" hidden><span>Nova senha</span><div class="input-wrap"><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Crie uma senha"></div></label>
            <label class="field password-reset-password" hidden><span>Confirmar nova senha</span><div class="input-wrap"><input name="confirmation" type="password" autocomplete="new-password" maxlength="128" required placeholder="Repita a senha"></div></label>
            <button class="primary-button" type="submit"><span>Validar código</span></button>
            <button class="text-button first-access-back" id="password-reset-back" type="button">Voltar para o login</button>
          </form>
          <form id="change-form" hidden>
            <label class="field"><span>Senha atual</span><div class="input-wrap"><input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></div></label>
            <label class="field"><span>Nova senha</span><div class="input-wrap"><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="icon-button" type="button" data-password-toggle title="Mostrar senha" aria-label="Mostrar senha"><i data-lucide="eye" aria-hidden="true"></i></button></div></label>
            <label class="field"><span>Confirmar nova senha</span><div class="input-wrap"><input name="confirmation" type="password" autocomplete="new-password" required maxlength="128"></div></label>
            <button class="primary-button" type="submit"><span>Salvar nova senha</span><i data-lucide="check" aria-hidden="true"></i></button>
          </form>
          <p class="access-status" id="access-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="live-update.js?v=20260921-ota-1"></script>
    <script src="assets/vendor/lucide.min.js"></script>
    <script src="login.js?v=20261001-password-reset-1"></script>
  </body>
</html>
