      .red { fill: none; stroke: #ff5a5f; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .softBlue { fill: #72a9ff; opacity: .18; stroke: none; }
      .softGreen { fill: #5de07b; opacity: .18; stroke: none; }
      .softOrange { fill: #ffad48; opacity: .18; stroke: none; }
