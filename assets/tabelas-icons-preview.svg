<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Previa de icones da area de tabelas">
  <defs>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:650;fill:#071a3d;text-anchor:middle}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:520;fill:#425474;text-anchor:middle}
      .card{fill:#fff;stroke:#dbe3ee;stroke-width:1.4}
    </style>
  </defs>
  <rect width="920" height="300" rx="24" fill="#f7f9fc"/>
  <g transform="translate(30 28)">
    <rect class="card" width="190" height="236" rx="18"/>
    <image href="icons/tabela-recebimento.svg" x="25" y="16" width="140" height="140"/>
    <text class="label" x="95" y="188">Recebimento</text>
    <text class="sub" x="95" y="215">entrada dos alimentos</text>
  </g>
  <g transform="translate(255 28)">
    <rect class="card" width="190" height="236" rx="18"/>
    <image href="icons/tabela-armazenamento.svg" x="25" y="16" width="140" height="140"/>
    <text class="label" x="95" y="188">Armazenamento</text>
    <text class="sub" x="95" y="215">temperatura e validade</text>
  </g>
  <g transform="translate(480 28)">
    <rect class="card" width="190" height="236" rx="18"/>
    <image href="icons/tabela-pre-preparo.svg" x="25" y="16" width="140" height="140"/>
    <text class="label" x="95" y="188">Pré-preparo</text>
    <text class="sub" x="95" y="215">preparação segura</text>
  </g>
  <g transform="translate(705 28)">
    <rect class="card" width="190" height="236" rx="18"/>
    <image href="icons/tabela-distribuicao.svg" x="25" y="16" width="140" height="140"/>
    <text class="label" x="95" y="188">Distribuição</text>
    <text class="sub" x="95" y="215">serviço e entrega</text>
  </g>
</svg>
